name: Verificar Abrace

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Android e regras SQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # O APK da CI aguarda ativação e nunca usa credenciais de produção.
      SUPABASE_URL: ""
      SUPABASE_ANON_KEY: ""
      ABRACE_TEST_CONTAINER: abrace-postgres-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Preparar Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Preparar Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Instalar SDK e Build Tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Preparar Gradle e validar o wrapper
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Verificar regras SQL em banco descartável
        run: ./scripts/test-backend.sh
      - name: Compilar APK, testar Kotlin e verificar Android Lint
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Identificar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/abrace-debug-${GITHUB_SHA}.apk"
          cd dist
          sha256sum *.apk > SHA256SUMS
          printf 'Commit: %s\nConfiguração: aguarda ativação (sem URL/chave do Supabase)\n' "$GITHUB_SHA" > BUILD.txt
          cat BUILD.txt >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Disponibilizar APK aprovado
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: abrace-debug-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Guardar relatórios de testes e lint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relatorios-${{ github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
